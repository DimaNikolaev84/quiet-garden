<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e20">
<meta name="color-scheme" content="dark">
<title>Тихий сад — Ночное сияние</title>

<style>
:root {
  --bg: #090e20;
  --text: #f4f6ff;
  --muted: #b8c2da;
  --cyan: #82dcff;
  --pink: #f4aedf;
  --line: rgba(225,235,255,.14);
  --glass: rgba(22,30,55,.78);
  --radius: 26px;
}

* { box-sizing: border-box }
[hidden] { display: none !important }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 5% 5%, #2259ab66, transparent 48%),
    radial-gradient(ellipse at 95% 25%, #973c8550, transparent 43%),
    radial-gradient(ellipse at 45% 85%, #40378b44, transparent 45%),
    #090e20;
}

button, input, select, textarea { font: inherit }
button { cursor: pointer }
button, a { -webkit-tap-highlight-color: transparent }
button:disabled { opacity: .5; cursor: wait }

button {
  min-height: 44px;
  padding: 11px 17px;
  border-radius: 15px;
  border: 1px solid transparent;
  background: linear-gradient(120deg, #a3e7ff, #c8c3ff);
  color: #11182e;
  font-weight: 650;
  transition: transform .18s, background .18s;
}
button:active { transform: scale(.97) }
button.secondary {
  color: var(--text);
  border-color: var(--line);
  background: #ffffff09;
}
button.ghost {
  color: var(--muted);
  background: transparent;
}
button.danger { background: #ff8daf16; color: #ffc1cf; border-color: #ff8daf30 }
button.small { padding: 8px 12px; font-size: 13px }
.icon-btn { width: 44px; padding: 0; display: grid; place-items: center }

:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px }

h1,h2,h3,p { margin: 0 }
h1 { font-size: clamp(30px,6vw,42px); letter-spacing: -.055em; font-weight: 700 }
h2 { font-size: 23px; letter-spacing: -.035em; font-weight: 650 }
h3 { font-size: 17px; letter-spacing: -.015em }
.muted { color: var(--muted) }
.caption { font-size: 13px; color: var(--muted) }
.eyebrow { color: var(--cyan); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 650 }

.app {
  width: min(100%, 1000px);
  margin: auto;
  padding: max(28px, env(safe-area-inset-top)) 24px 135px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px }
header p { margin-top: 4px }

.glass {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--glass);
  box-shadow: 0 16px 48px #00000020, inset 0 1px 0 #ffffff06;
}

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass {
    background: rgba(22,30,55,.65);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
}

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 27px 0 16px }
.section-head .caption { margin-top: 3px }

.garden {
  padding: 25px 27px 21px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 80% 50%, #c075ce16, transparent 55%),
    linear-gradient(135deg, #23436670, #202037b8);
}
.garden-head, .garden-bottom { display: flex; align-items: center; justify-content: space-between; gap: 15px }
.pill {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  white-space: nowrap;
  border: 1px solid #b8dfff25;
  background: #c8e6ff0a;
  color: #d5e6ff;
  padding: 6px 11px;
  border-radius: 30px;
  font-size: 12px;
}

.scene {
  min-height: 230px;
  position: relative;
  display: flex;
  align-items: end;
  gap: 10px;
  overflow-x: auto;
  padding: 22px 10px 14px;
}
.scene::before {
  content: "";
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: 33px;
  height: 65px;
  background: radial-gradient(ellipse, #86baff22, transparent 70%);
  pointer-events: none;
}
.plant {
  position: relative;
  flex: 1 0 115px;
  text-align: center;
  min-width: 115px;
}
.plant svg { width: 120px; height: 150px; overflow: visible }
.plant-name {
  display: block;
  max-width: 145px;
  margin: auto;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.plant-days { color: var(--muted); font-size: 11px }
.garden-bottom { padding-top: 15px; border-top: 1px solid #ffffff0b }
.garden-bottom p { font-size: 13px; color: #ced8ed }
.level-progress { width: 105px; flex-shrink: 0 }
.level-progress .caption { text-align: right; margin-bottom: 6px; font-size: 11px }

.track { height: 5px; overflow: hidden; background: #dce5ff10; border-radius: 20px }
.track > div {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #7bd4f3, #c8b5ef);
}
.habits { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px }
.habit { padding: 22px; }
.habit-top { display: flex; align-items: center; gap: 12px }
.habit-top .name { flex: 1; min-width: 0 }
.name h3 { overflow-wrap: anywhere }
.habit-icon {
  width: 44px; height: 44px; flex-shrink: 0;
  display: grid; place-items: center;
  color: var(--cyan); border-radius: 14px;
  background: linear-gradient(135deg,#9dddff18,#d497fa12);
  border: 1px solid #c4deff16;
  font-size: 21px;
}
.habit-number { font-size: 29px; letter-spacing: -.045em; margin: 20px 0 10px; font-weight: 600 }
.habit-number span { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0 }
.habit-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px }
.preview {
  margin-top: 15px;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.done-label { color: #b5ead8; font-size: 12px }
.empty { text-align: center; padding: 34px 20px; color: var(--muted) }
.empty h3 { color: var(--text); margin-bottom: 8px }

.page-title { margin: 7px 0 23px }
.page-title h2 { font-size: 29px; margin-bottom: 7px }

label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 17px }
input,textarea,select {
  display: block;
  width: 100%;
  min-width: 0;
  margin-top: 7px;
  border: 1px solid #c4d1f322;
  border-radius: 14px;
  padding: 13px;
  background: #0c1326cc;
  color: var(--text);
  font-size: 16px;
}
textarea { min-height: 135px; resize: vertical }
input::placeholder,textarea::placeholder { color: #929eb7 }
select { color-scheme: dark }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }

.journal { display: grid; gap: 14px }
.entry { padding: 23px; background: rgba(20,28,49,.92) }
.entry-top { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.entry-note { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; margin-top: 19px }
.entry-actions { display: flex; justify-content: flex-end; gap: 5px; margin-top: 13px }

.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 11px; margin-bottom: 16px }
.stat { padding: 20px 16px }
.stat strong { display: block; font-size: 27px; letter-spacing: -.04em; color: #e0ebff }
.stat span { font-size: 12px; color: var(--muted) }
.chart-card { padding: 23px; margin-bottom: 16px }
.chart { display: grid; grid-template-columns: repeat(14,minmax(0,1fr)); gap: 8px; height: 185px; margin-top: 24px }
.column { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 9px }
.bar-space { display: flex; align-items: end; width: 100%; flex: 1 }
.bar {
  padding: 0; min-height: 4px; width: 100%;
  border: 1px solid #aff1ff30;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(0deg,#4788b2,#9ee5fc);
}
.column:last-child .bar { background: linear-gradient(0deg,#9b69b5,#f2b9e0); border-color: #f8ccec40 }
.column small { font-size: 10px; color: var(--muted) }
.heatmap { display: grid; grid-template-columns: repeat(14,1fr); gap: 6px; margin-top: 18px }
.cell { padding: 0; min-height: 0; aspect-ratio: 1; border-radius: 6px; background: #b1c8ff0c; border: 1px solid #b1c8ff08 }
.cell[data-level="1"] { background: #284760 }
.cell[data-level="2"] { background: #3c7394 }
.cell[data-level="3"] { background: #62a9c9 }
.cell[data-level="4"] { background: #a7e5f7 }

.settings-card { padding: 25px; margin-bottom: 17px }
.settings-card p { margin-top: 12px; color: var(--muted) }
.actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 9px; margin-top: 23px }
.settings-card .actions { justify-content: start }

.bottom-nav {
  position: fixed;
  z-index: 5;
  bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  padding: 7px;
  width: min(410px,calc(100% - 32px));
  border-radius: 23px;
  background: #101a30ed;
  box-shadow: 0 10px 50px #00000055;
}
.bottom-nav button {
  flex: 1; min-width: 0;
  color: var(--muted);
  background: transparent;
  border-radius: 17px;
  display: grid; place-items: center;
  gap: 3px; font-size: 11px;
  padding: 9px 6px;
}
.bottom-nav button.active {
  color: #e9f8ff;
  background: linear-gradient(135deg,#94dfff21,#c28ef519);
  border-color: #bedbff1b;
}
svg.icon { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }

dialog {
  width: min(510px,calc(100% - 24px));
  max-height: 90dvh;
  overflow-y: auto;
  padding: 27px;
  border: 1px solid #d5e2ff2a;
  border-radius: 27px;
  background: #151e33;
  color: var(--text);
  box-shadow: 0 30px 100px #00000066;
}
dialog::backdrop { background: #030917b8 }
dialog h2 { margin-bottom: 23px }
.dialog-head { display: flex; align-items: start; justify-content: space-between; gap: 10px }
.dialog-head h2 { margin-top: 4px }

#toast {
  position: fixed;
  z-index: 20;
  top: max(18px,env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 30px);
  padding: 13px 20px;
  border-radius: 17px;
  border: 1px solid #c5e9ff3a;
  color: #eef7ff;
  background: #1c2e48;
  box-shadow: 0 12px 45px #00000055;
  font-size: 14px;
}

.saved .garden { animation: glow .85s ease }
@keyframes glow {
  50% { box-shadow: 0 0 45px #9bcfff28, inset 0 0 35px #dfb1ff0b }
}
@media(max-width:600px) {
  .app { padding-left: 16px; padding-right: 16px }
  header { margin-bottom: 23px }
  .garden { padding: 21px 19px 19px }
  .garden-head { gap: 8px }
  .garden-head h2 { font-size: 19px }
  .scene { min-height: 220px }
  .habits { grid-template-columns: 1fr }
  .habit { padding: 20px }
  .garden-bottom { align-items: start }
  .garden-bottom p { max-width: 190px }
  .stat { padding: 15px 10px }
  .stat strong { font-size: 24px }
  .stat span { font-size: 11px }
  .stats-grid { gap: 8px }
  .chart { gap: 5px }
  .heatmap { gap: 4px }
  .chart-card { padding: 20px 16px }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation: none !important; transition: none !important }
}
@media(prefers-reduced-transparency:reduce) {
  .glass { background: #172138; backdrop-filter: none; -webkit-backdrop-filter: none }
}
</style>
</head>

<body>
<main class="app">
  <header>
    <div>
